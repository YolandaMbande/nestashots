
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f8f5f1">
    <title>Page Not Found | Nestas hots</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --background: #f8f5f1;
            --surface: #fffdf9;
            --text: #292720;
            --muted: #817b70;
            --accent: #9b7653;
            --border: #e8e0d6;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: var(--background);
            color: var(--text);
            font-family: "DM Sans", sans-serif;
        }

        .error-card {
            width: 100%;
            max-width: 620px;
            padding: clamp(36px, 8vw, 76px) 28px;
            text-align: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            box-shadow: 0 24px 70px rgba(53, 43, 31, 0.06);
            animation: appear 0.7s ease both;
        }

        .brand {
            margin-bottom: 48px;
            color: var(--accent);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        .error-code {
            color: var(--accent);
            font-family: "Playfair Display", serif;
            font-size: clamp(6rem, 20vw, 10rem);
            font-weight: 500;
            line-height: 0.95;
            letter-spacing: -0.07em;
        }

        .divider {
            width: 48px;
            height: 1px;
            margin: 30px auto;
            background: var(--accent);
        }

        h1 {
            margin-bottom: 14px;
            font-family: "Playfair Display", serif;
            font-size: clamp(1.7rem, 5vw, 2.4rem);
            font-weight: 500;
        }

        .description {
            max-width: 360px;
            margin: 0 auto;
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.8;
        }

        .actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 34px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 0 24px;
            border: 1px solid var(--text);
            border-radius: 3px;
            font: inherit;
            font-size: 0.85rem;
            text-decoration: none;
            transition: background 0.25s ease, color 0.25s ease,
                        transform 0.25s ease;
        }

        .button-primary {
            background: var(--text);
            color: white;
        }

        .button-primary:hover {
            background: var(--accent);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .button-secondary {
            color: var(--text);
            background: transparent;
        }

        .button-secondary:hover {
            background: var(--background);
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 52px;
            color: #a49c91;
            font-size: 0.72rem;
            letter-spacing: 0.08em;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 420px) {
            .brand {
                margin-bottom: 36px;
            }

            .actions {
                flex-direction: column;
            }

            .button {
                width: 100%;
            }

            .footer {
                margin-top: 38px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <main class="error-card">
        <div class="brand">Nestashots</div>

        <div class="error-code" aria-hidden="true">404</div>

        <div class="divider"></div>

        <h1>Lost in the little details?</h1>

        <p class="description">
            It seems this page has wandered off.
            Let's get you back to somewhere familiar.
        </p>

        <div class="actions">
            <a class="button button-primary" href="./">
                Back to Home
            </a>

            <a class="button button-secondary"
               href="javascript:history.back()">
                Go Back
            </a>
        </div>

        <p class="footer">A LITTLE DETOUR, NOTHING MORE.</p>
    </main>
</body>
</html>
